# Gitpod configuration for one-click cloud development
# Open this project in Gitpod: https://gitpod.io/#https://github.com/your-org/bizon-platform

image: gitpod/workspace-python-3.12

tasks:
  - name: Database
    init: |
      # Install uv if not present
      curl -LsSf https://astral.sh/uv/install.sh | sh
      source $HOME/.local/bin/env
    command: |
      docker run --name bizon-db -d \
        -e POSTGRES_USER=bizon \
        -e POSTGRES_PASSWORD=bizon \
        -e POSTGRES_DB=bizon_platform \
        -p 5432:5432 \
        postgres:16-alpine
      gp sync-done db-started

  - name: Backend
    init: |
      # Setup environment
      cp .env.example .env
      echo "ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> .env
      # Install uv and dependencies
      curl -LsSf https://astral.sh/uv/install.sh | sh
      source $HOME/.local/bin/env
      uv sync
    command: |
      source $HOME/.local/bin/env
      gp sync-await db-started
      sleep 3
      uv run alembic upgrade head
      uv run python -m bizon_platform.seed
      uv run python -m bizon_platform

  - name: Worker
    command: |
      source $HOME/.local/bin/env
      gp sync-await db-started
      sleep 5
      uv run python -m bizon_platform.worker

  - name: Frontend
    init: cd ui && npm install
    command: cd ui && npm run dev -- --host 0.0.0.0

ports:
  - port: 5173
    onOpen: open-preview
    name: Frontend (UI)
    description: React development server
  - port: 8000
    onOpen: ignore
    name: Backend (API)
    description: FastAPI server
  - port: 5432
    onOpen: ignore
    name: PostgreSQL
    description: Database

vscode:
  extensions:
    - ms-python.python
    - ms-python.vscode-pylance
    - charliermarsh.ruff
    - dbaeumer.vscode-eslint
    - bradlc.vscode-tailwindcss
