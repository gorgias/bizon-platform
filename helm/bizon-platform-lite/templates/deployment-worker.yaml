apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bizon-platform-lite.fullname" . }}-worker
  labels:
    {{- include "bizon-platform-lite.worker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "bizon-platform-lite.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "bizon-platform-lite.worker.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "bizon-platform-lite.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "bizon-platform-lite.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-api
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for API to be ready..."
              until curl -sf http://{{ include "bizon-platform-lite.fullname" . }}-api:{{ .Values.api.service.port }}/api/health > /dev/null 2>&1; do
                echo "API not ready, retrying..."
                sleep 2
              done
              echo "API is ready!"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["python", "-m", "bizon_platform_lite.worker"]
          env:
            - name: DB_USERNAME
              value: {{ include "bizon-platform-lite.postgresql.username" . | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bizon-platform-lite.postgresql.secretName" . }}
                  key: postgres-password
            - name: DATABASE_URL
              value: {{ include "bizon-platform-lite.databaseUrl" . | quote }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bizon-platform-lite.encryptionKeySecretName" . }}
                  key: encryption-key
                  optional: true
          envFrom:
            - configMapRef:
                name: {{ include "bizon-platform-lite.fullname" . }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f "bizon_platform_lite.worker" > /dev/null
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: outputs
              mountPath: /data/outputs
            - name: custom-sources
              mountPath: /custom_sources
      volumes:
        - name: outputs
          persistentVolumeClaim:
            claimName: {{ include "bizon-platform-lite.fullname" . }}-outputs
        - name: custom-sources
          persistentVolumeClaim:
            claimName: {{ include "bizon-platform-lite.fullname" . }}-custom-sources
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
