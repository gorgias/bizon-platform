apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bizon-platform-lite.fullname" . }}
  labels:
    {{- include "bizon-platform-lite.labels" . | nindent 4 }}
data:
  DEBUG: {{ .Values.config.debug | quote }}
  WORKER_POLL_INTERVAL: {{ .Values.config.workerPollInterval | quote }}
  LOG_RETENTION_DAYS: {{ .Values.config.logRetentionDays | quote }}
  CUSTOM_SOURCES_DIR: {{ .Values.config.customSourcesDir | quote }}
  STORAGE_LOCAL_PATH: /data/outputs
  INSTANCE_NAME: {{ .Values.config.instanceName | quote }}
  INSTANCE_DESCRIPTION: {{ .Values.config.instanceDescription | quote }}
  CORS_ALLOWED_ORIGINS: {{ include "bizon-platform-lite.corsAllowedOrigins" . | quote }}
  {{- if .Values.gitSync.enabled }}
  GIT_SYNC_ENABLED: "true"
  GIT_SYNC_REPO_URL: {{ .Values.gitSync.repoUrl | quote }}
  GIT_SYNC_BRANCH: {{ .Values.gitSync.branch | quote }}
  GIT_SYNC_PATH: {{ .Values.gitSync.path | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bizon-platform-lite.fullname" . }}-nginx
  labels:
    {{- include "bizon-platform-lite.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Gzip compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Handle React Router
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests to backend
        location /api {
            proxy_pass http://{{ include "bizon-platform-lite.fullname" . }}-api:{{ .Values.api.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
