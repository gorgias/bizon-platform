apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bizon-platform-lite.fullname" . }}-api
  labels:
    {{- include "bizon-platform-lite.api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "bizon-platform-lite.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "bizon-platform-lite.api.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "bizon-platform-lite.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "bizon-platform-lite.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until python -c "
              import asyncio
              import asyncpg
              async def check():
                  try:
                      conn = await asyncpg.connect(
                          host='{{ include "bizon-platform-lite.postgresql.host" . }}',
                          port={{ include "bizon-platform-lite.postgresql.port" . }},
                          user='{{ include "bizon-platform-lite.postgresql.username" . }}',
                          password='$DB_PASSWORD',
                          database='{{ include "bizon-platform-lite.postgresql.database" . }}'
                      )
                      await conn.close()
                      return True
                  except Exception as e:
                      print(f'Waiting: {e}')
                      return False
              exit(0 if asyncio.run(check()) else 1)
              "; do
                sleep 2
              done
              echo "PostgreSQL is ready!"
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bizon-platform-lite.postgresql.secretName" . }}
                  key: postgres-password
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["uv", "run", "alembic", "upgrade", "head"]
          env:
            - name: DB_USERNAME
              value: {{ include "bizon-platform-lite.postgresql.username" . | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bizon-platform-lite.postgresql.secretName" . }}
                  key: postgres-password
            - name: DATABASE_URL
              value: {{ include "bizon-platform-lite.databaseUrl" . | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "bizon-platform-lite.fullname" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["python", "-m", "bizon_platform_lite"]
          env:
            - name: DB_USERNAME
              value: {{ include "bizon-platform-lite.postgresql.username" . | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bizon-platform-lite.postgresql.secretName" . }}
                  key: postgres-password
            - name: DATABASE_URL
              value: {{ include "bizon-platform-lite.databaseUrl" . | quote }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bizon-platform-lite.encryptionKeySecretName" . }}
                  key: encryption-key
                  optional: true
            {{- if .Values.security.adminPassword }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bizon-platform-lite.adminPasswordSecretName" . }}
                  key: admin-password
            {{- end }}
            {{- if and .Values.gitSync.enabled .Values.gitSync.token }}
            - name: GIT_SYNC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bizon-platform-lite.gitTokenSecretName" . }}
                  key: git-token
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "bizon-platform-lite.fullname" . }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: outputs
              mountPath: /data/outputs
            - name: custom-sources
              mountPath: /custom_sources
      volumes:
        - name: outputs
          persistentVolumeClaim:
            claimName: {{ include "bizon-platform-lite.fullname" . }}-outputs
        - name: custom-sources
          persistentVolumeClaim:
            claimName: {{ include "bizon-platform-lite.fullname" . }}-custom-sources
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
