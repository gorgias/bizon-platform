# Production values for bizon-platform
# This file contains recommended settings for production deployments

# Disable bundled PostgreSQL in favor of external managed database
postgresql:
  enabled: false

# External database configuration (e.g., Cloud SQL, RDS)
externalDatabase:
  host: "your-db-host.example.com"
  port: 5432
  database: bizon_platform
  username: bizon
  # Use existingSecret for credentials
  existingSecret: "bizon-db-credentials"
  sslMode: require

# API server configuration
api:
  replicaCount: 2
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 2Gi
      cpu: 2000m
  # Pod disruption budget
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/api/metrics"

# Worker configuration with autoscaling
worker:
  replicaCount: 2
  resources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 4Gi
      cpu: 4000m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# UI configuration
ui:
  replicaCount: 2
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 1000m

# Security configuration
security:
  # Use existing secret for encryption key
  existingEncryptionKeySecret: "bizon-encryption-key"
  # Enable basic auth
  existingAdminPasswordSecret: "bizon-admin-credentials"

# Application configuration
config:
  debug: false
  workerPollInterval: 5
  logRetentionDays: 90
  instanceName: "Bizon Production"

# Git sync for custom sources (optional)
gitSync:
  enabled: false
  # Uncomment and configure for production
  # enabled: true
  # repoUrl: "https://github.com/your-org/custom-sources.git"
  # branch: main
  # path: sources
  # existingTokenSecret: "bizon-git-credentials"

# Storage configuration
storage:
  outputs:
    size: 50Gi
    # Use a storage class that supports ReadWriteMany for multi-replica setups
    storageClass: "standard-rwx"
    accessMode: ReadWriteMany
  customSources:
    size: 5Gi
    storageClass: "standard-rwx"
    accessMode: ReadWriteMany

# Ingress with TLS
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  hosts:
    - host: bizon.your-domain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: bizon-tls
      hosts:
        - bizon.your-domain.com

# Service account with workload identity (GKE example)
serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: bizon@your-project.iam.gserviceaccount.com

# Pod security context
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
