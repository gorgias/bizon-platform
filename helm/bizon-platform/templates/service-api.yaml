apiVersion: v1
kind: Service
metadata:
  name: {{ include "bizon-platform.fullname" . }}-api
  labels:
    {{- include "bizon-platform.api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "bizon-platform.api.selectorLabels" . | nindent 4 }}
