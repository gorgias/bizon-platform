apiVersion: v1
kind: Service
metadata:
  name: {{ include "bizon-platform.fullname" . }}-ui
  labels:
    {{- include "bizon-platform.ui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "bizon-platform.ui.selectorLabels" . | nindent 4 }}
