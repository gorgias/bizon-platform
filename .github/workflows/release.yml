name: Build & Publish to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CHART_REPO: ghcr.io/bizon-data/charts

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    name: Build ${{ matrix.target }} image
    runs-on: gh-actions-4cpu4gb-dind-runner-set
    strategy:
      matrix:
        include:
          - target: backend
            image_name: bizon-platform
          - target: ui
            image_name: bizon-platform-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/bizon-data/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-helm-chart:
    name: Publish Helm chart
    runs-on: gh-actions-0.5cpu1gb-runner-set
    needs: build-images
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Get short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Update appVersion in Chart.yaml
        run: |
          cd helm/bizon-platform
          sed -i "s/^appVersion:.*/appVersion: \"sha-${{ steps.sha.outputs.short_sha }}\"/" Chart.yaml
          echo "Updated Chart.yaml:"
          cat Chart.yaml

      - name: Package Helm chart
        run: |
          helm package helm/bizon-platform --destination .

      - name: Push Helm chart to GHCR
        run: |
          CHART_VERSION=$(grep '^version:' helm/bizon-platform/Chart.yaml | awk '{print $2}')
          helm push bizon-platform-${CHART_VERSION}.tgz oci://${{ env.CHART_REPO }}
